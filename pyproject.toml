[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a11ypilot"
version = "0.1.0"
description = "Accessibility-first desktop automation agent, safety policy engine, and MCP bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AryaMehr Namdary", email = "darklegend1380@gmail.com" }]
keywords = [
    "accessibility",
    "desktop-automation",
    "mcp",
    "model-context-protocol",
    "ui-automation",
    "windows-uia",
    "human-in-the-loop",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "comtypes>=1.4; sys_platform == \"win32\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
a11ypilot = "a11ypilot.cli:app"

[project.urls]
Homepage = "https://github.com/AryaMehr-Nam/A11yPilot"
Repository = "https://github.com/AryaMehr-Nam/A11yPilot"
Issues = "https://github.com/AryaMehr-Nam/A11yPilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"a11ypilot.ui" = ["*.html", "*.css", "*.js"]
"a11ypilot.config" = ["*.yaml"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["comtypes", "comtypes.*", "tkinter", "tkinter.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
